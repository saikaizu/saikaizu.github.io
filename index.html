    <style>
        /* Optimasi CSS: Tambahin font-display swap */
        @font-face { font-family: 'Inter'; font-display: swap; }
        
        .gradient-bg { background: linear-gradient(90deg, #000428 0%, #004e92 100%); }
        .dark .dark-gradient { background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); }
        html { scroll-behavior: smooth; }

        .water-layer { position: absolute; inset: -20px; filter: url(#water-filter); opacity: 0.6; z-index: 1; }
        .water-surface-base { width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.4) 0%, transparent 70%); border-radius: 50%; }
        .float-pure { animation: floating 4s ease-in-out infinite; position: relative; z-index: 10; }
        @keyframes floating { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-25px) rotate(1deg); } }
        .wave-line { position: absolute; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; animation: ripple 6s infinite; pointer-events: none; z-index: 5; }
        @keyframes ripple { 0% { transform: scale(0.6); opacity: 0; } 50% { opacity: 0.5; border-width: 1px; } 100% { transform: scale(2.2); opacity: 0; } }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #004e92; border-radius: 10px; }
        .blob { position: absolute; background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.2) 100%); filter: blur(40px); z-index: 0; animation: morphing 12s infinite alternate ease-in-out; }
        @keyframes morphing { 0% { border-radius: 40% 60% 60% 40% / 40% 30% 70% 60%; } 100% { border-radius: 60% 40% 40% 60% / 60% 70% 30% 40%; } }
        .social-link { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .social-link:hover { transform: translateY(-10px) scale(1.1); }
        
        /* Pencegahan CLS (Content Layout Shift) */
        img { content-visibility: auto; }
    </style>
</head>

<section id="disqus_section" class="py-32 bg-gray-50 dark:bg-slate-950">

            </div>
        </div>
    </div>
</section>

<script>
    // 1. Trik Lazy Load Disqus biar gak ngerusak skor
    function loadDisqus() {
        var d = document, s = d.createElement('script');
        s.src = 'https://portofolio-8.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        document.getElementById('disqus_thread').innerHTML = 'Loading comments...';
    }

    // 2. Optimasi Scroll & Reveal
    const reveals = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add("active");
        });
    }, { threshold: 0.1 });
    reveals.forEach(r => observer.observe(r));

    // 3. Navbar Logic (Passive Listener biar skor naik)
    window.addEventListener("scroll", () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 80) {
            nav.classList.add('glass', 'py-4', 'shadow-2xl');
            nav.classList.remove('py-6');
        } else {
            nav.classList.remove('glass', 'py-4', 'shadow-2xl');
            nav.classList.add('py-6');
        }
    }, { passive: true });

    // 4. Sisanya logic asli lu (Lang & Theme)
    const translations = { /* ... copy data translation lu ... */ };
    const langSelect = document.getElementById('lang-select');
    const updateLanguage = (lang) => {
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if (translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
        });
        document.documentElement.lang = lang;
        localStorage.setItem('preferred-lang', lang);
    };
    langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));
    updateLanguage(localStorage.getItem('preferred-lang') || 'id');

    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    themeToggle.addEventListener('click', () => {
        const isDark = html.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
    if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

    document.getElementById("year").innerHTML = new Date().getFullYear();
</script>

    <style>
        /* CSS Utama tetep di head biar pas web buka gak "polos" banget (FOUC) */
        .gradient-bg { background: linear-gradient(90deg, #000428 0%, #004e92 100%); }
        .dark .dark-gradient { background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); }
        html { scroll-behavior: smooth; }

        .water-layer { position: absolute; inset: -20px; filter: url(#water-filter); opacity: 0.6; z-index: 1; }
        .water-surface-base { width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.4) 0%, transparent 70%); border-radius: 50%; }
        .float-pure { animation: floating 4s ease-in-out infinite; position: relative; z-index: 10; }
        @keyframes floating { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-25px) rotate(1deg); } }
        .wave-line { position: absolute; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; animation: ripple 6s infinite; pointer-events: none; z-index: 5; }
        @keyframes ripple { 0% { transform: scale(0.6); opacity: 0; } 50% { opacity: 0.5; border-width: 1px; } 100% { transform: scale(2.2); opacity: 0; } }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #004e92; border-radius: 10px; }
        .blob { position: absolute; background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.2) 100%); filter: blur(40px); z-index: 0; animation: morphing 12s infinite alternate ease-in-out; }
        @keyframes morphing { 0% { border-radius: 40% 60% 60% 40% / 40% 30% 70% 60%; } 100% { border-radius: 60% 40% 40% 60% / 60% 70% 30% 40%; } }
        .social-link { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .social-link:hover { transform: translateY(-10px) scale(1.1); }
        #lang-select option { background-color: white; color: black; padding: 10px; }
        .dark #lang-select option { background-color: #0f172a; color: white; }
    </style>
</head>

    <script>
        // Copy Paste Logik Multi Language, Theme Toggle, & Scroll lu di sini
        const translations = {
            id: {
                nav_home: "Beranda", nav_about: "Tentang", nav_exp: "Pengalaman", nav_disc: "Diskusi", nav_work: "Karya",
                hire_me: "REKRUT SAYA!", hero_badge: "Siap Berinovasi",
                hero_desc: "Full Stack Developer & IT Support. Berpengalaman dalam riset sistem operasional dan pengembangan aplikasi modern.",
                btn_work: "KARYA SAYA", about_title: "Tentang <br><span class='text-blue-600'>Sang Dev</span>",
                about_p1: "Saya memiliki pengalaman di dunia IT dalam bidang riset sistem seperti install dan uninstall OS baik itu Windows based, Distro Linux, dan Mac OS.",
                about_p2: "Saya juga dapat melakukan perbaikan dan perawatan inventaris IT. Tools: Cordova, Flutter, Laravel, Git, dan MySQL.",
                exp_title: "Perjalanan <span class='text-blue-500 underline underline-offset-8'>Profesional</span>",
                exp_gfp_date: "Agu 2025 - Aktif", exp_gfp_1: "Sistem Helpdesk & Tiket.", exp_gfp_2: "Pemeliharaan Hardware.", exp_gfp_3: "Tim Pengembangan Proyek.",
                exp_kaizu: "UMKM fokus pada servis hardware serta jasa pembuatan aplikasi web/mobile menggunakan Laravel, Cordova, & Flutter.",
                exp_abm: "Pemeriksaan relasi database, pembuatan UML, dan pengembangan aplikasi koperasi.",
                exp_pos: "'Mendapatkan nilai A dan menjadi titik balik karir saya.'",
                talk_title: "Mari Bicara", footer_desc: "Membangun solusi digital dari nol.",
                footer_connect: "Hubungi Saya", footer_loc: "Kota Tangerang, Banten", footer_rights: "HAK CIPTA DILINDUNGI.", footer_freelance: "Tersedia untuk Freelance"
            },
            en: {
                nav_home: "Home", nav_about: "About", nav_exp: "Experience", nav_disc: "Discussion", nav_work: "Work",
                hire_me: "HIRE ME!", hero_badge: "Ready to Innovate",
                hero_desc: "Full Stack Developer & IT Support. Experienced in operating system research and modern application development.",
                btn_work: "MY WORK", about_title: "About <br><span class='text-blue-600'>The Dev</span>",
                about_p1: "I have experience in IT system research like OS installation, Linux, and Mac OS.",
                about_p2: "I can perform IT inventory maintenance. Tools: Cordova, Flutter, Laravel, Git, and MySQL.",
                exp_title: "Professional <span class='text-blue-500 underline underline-offset-8'>Journey</span>",
                exp_gfp_date: "Aug 2025 - Active", exp_gfp_1: "Helpdesk & Ticket System.", exp_gfp_2: "Hardware Maintenance.", exp_gfp_3: "Project Development Team.",
                exp_kaizu: "SME focused on hardware and web/mobile apps using Laravel, Cordova, & Flutter.",
                exp_abm: "Database checks, UML, and cooperative app development.",
                exp_pos: "'Received an A grade and it became the turning point of my career.'",
                talk_title: "Let's Talk", footer_desc: "Building digital solutions from scratch.",
                footer_connect: "Connect With Me", footer_loc: "Tangerang City, Banten", footer_rights: "ALL RIGHTS RESERVED.", footer_freelance: "Available for Freelance"
            }
            // Tambahin JP kalau perlu
        };

        // Logic Language
        const langSelect = document.getElementById('lang-select');
        const updateLanguage = (lang) => {
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
            });
            document.documentElement.lang = lang;
            localStorage.setItem('preferred-lang', lang);
        };
        langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));
        const savedLang = localStorage.getItem('preferred-lang') || 'id';
        langSelect.value = savedLang;
        updateLanguage(savedLang);

        // Logic Scroll & Reveal
        const reveals = document.querySelectorAll(".reveal");
        const handleScroll = () => {
            reveals.forEach(reveal => {
                const windowHeight = window.innerHeight;
                if (reveal.getBoundingClientRect().top < windowHeight - 100) reveal.classList.add("active");
            });
            const nav = document.getElementById('navbar');
            if (window.scrollY > 80) {
                nav.classList.add('glass', 'py-4', 'shadow-2xl');
                nav.classList.remove('py-6');
            } else {
                nav.classList.remove('glass', 'py-4', 'shadow-2xl');
                nav.classList.add('py-6');
            }
        };
        window.addEventListener("scroll", handleScroll);
        window.addEventListener("load", handleScroll);

        // Logic Theme
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // Disqus Defer (Load pas scroll aja biar kenceng)
        let disqusLoaded = false;
        window.addEventListener('scroll', () => {
            if (!disqusLoaded && window.scrollY > 1000) {
                var d = document, s = d.createElement('script');
                s.src = 'https://portofolio-8.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                disqusLoaded = true;
            }
        });

        document.getElementById("year").innerHTML = new Date().getFullYear();
    </script>
